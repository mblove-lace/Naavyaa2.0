

{% load static %}


<!-- =====================================================
     SIDEBAR NAVIGATION
     =====================================================
     Each <a> with data-panel="xyz" maps to id="panel-xyz"
     in dashboard.html. JS reads data-panel to show/hide panels.
     "is-active" highlights the current tab visually.
====================================================== -->
<nav class="dash-nav">

  <!-- Orders tab — active by default on page load -->
  {% comment %} {% if active_nav %}
    <a href="{% url 'customer:dashboard' %}" class="is-active">Orders</a>
  {% else %}
    <a href="{% url 'customer:dashboard' %}" data-panel="orders" class="is-active">Orders</a>
  {% endif %} {% endcomment %}
  <a href="#" data-panel="orders" class="is-active">Orders</a>

   <!-- Wishlist tab -->
   

  {% comment %} <!-- Wishlist tab -->
  <a href="{% url 'customer:order_detail' %}" data-panel="order">Orders</a> {% endcomment %}

  <!-- Notifications tab -->
  <a href="#" data-panel="notis">Notifications</a>

  <!-- Addresses tab -->
  <a href="#" data-panel="addresses">Addresses</a>

  <!-- Reviews tab -->
  <a href="#" data-panel="reviews">Reviews</a>

  <!-- Divider between main tabs and account actions -->
  <div class="nav-divider"></div>

  <!-- Profile tab -->
  <a href="#" data-panel="profile">Profile</a>

  <!-- Log Out — navigates away, not a panel tab -->
  <a href="{% url 'userauths:logout' %}">Log Out</a>

</nav>
<!-- END SIDEBAR NAV -->
